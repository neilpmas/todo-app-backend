name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 26
        uses: actions/setup-java@v6
        with:
          java-version: "26"
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B verify
